services:
  # Backend API Web Service
  - type: web
    name: mock-gst-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: JWT_SECRET
        generateValue: true
      - key: MOCK_GST_API_KEY
        value: gst_sih26130_secret_api_key_mock_2026
      - key: MOCK_OTP
        value: "123456"
